<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create a new artwork listing on Arthaus."
    />
    <title>Create Listing</title>
    <script type="module" crossorigin src="/assets/createListing-De8OXhNp.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/user-state-CZOb1x_p.js">
    <link rel="modulepreload" crossorigin href="/assets/post-DBsons9j.js">
    <link rel="modulepreload" crossorigin href="/assets/api-key-Ci8oekRL.js">
    <link rel="stylesheet" crossorigin href="/assets/user-state-bchaTmG8.css">
  </head>
  <body class="bg-paper font-sans text-ink">
    <main class="mx-auto max-w-3xl px-4 pb-24 pt-5 sm:px-6 lg:px-10 lg:py-20">
      <a
        class="inline-flex items-center gap-2 text-xs font-medium uppercase tracking-[0.2em] text-muted-ink"
        href="../../index.html"
        >&lt;- Back</a
      >
      <p
        class="mb-3 mt-10 text-xs font-medium uppercase tracking-[0.3em] text-auction-red"
      >
        Submit Work
      </p>
      <h1 class="font-display text-3xl font-black italic sm:text-5xl">
        Create Listing
      </h1>
      <p class="mb-10 mt-3 text-sm text-muted-ink sm:text-base">
        Submit your work for auction. All marked fields are required.
      </p>

      <p
        id="listing-message"
        class="mb-8 hidden border border-success bg-success/10 p-4 text-sm font-medium text-success"
        role="status"
        aria-live="polite"
      ></p>

      <form id="create-listing-form" class="space-y-7" novalidate>
        <section>
          <p
            class="mb-4 text-xs font-medium uppercase tracking-[0.3em] text-auction-red"
          >
            Work Details
          </p>
          <div class="space-y-4">
            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="listing-title"
                >Title *</label
              >
              <input
                id="listing-title"
                class="w-full border border-line bg-white px-4 py-3 text-base outline-none focus:border-ink"
                name="title"
                placeholder="e.g. Solitude in Amber"
                required
              />
            </div>
            <div class="grid gap-4 sm:grid-cols-2 sm:gap-5">
              <div>
                <label
                  class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                  for="listing-artist"
                  >Artist</label
                >
                <input
                  id="listing-artist"
                  class="w-full border border-line bg-white px-4 py-3 text-sm text-muted-ink"
                  name="artist"
                  readonly
                />
              </div>
              <div>
                <label
                  class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                  for="listing-year"
                  >Year</label
                >
                <input
                  id="listing-year"
                  class="w-full border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
                  name="year"
                  inputmode="numeric"
                  maxlength="4"
                  placeholder="e.g. 2023"
                />
              </div>
            </div>
          </div>
        </section>

        <section>
          <p
            class="mb-4 text-xs font-medium uppercase tracking-[0.3em] text-auction-red"
          >
            Medium *
          </p>
          <div id="medium-options" class="mb-4 flex flex-wrap gap-2">
            <button
              class="medium-option border border-line bg-white px-4 py-2 text-xs font-medium uppercase tracking-[0.15em] text-muted-ink"
              data-medium="oil"
              type="button"
            >
              Oil
            </button>
            <button
              class="medium-option border border-line bg-white px-4 py-2 text-xs font-medium uppercase tracking-[0.15em] text-muted-ink"
              data-medium="acrylic"
              type="button"
            >
              Acrylic
            </button>
            <button
              class="medium-option border border-line bg-white px-4 py-2 text-xs font-medium uppercase tracking-[0.15em] text-muted-ink"
              data-medium="watercolor"
              type="button"
            >
              Watercolor
            </button>
          </div>
          <div class="grid gap-4 sm:grid-cols-2 sm:gap-5">
            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="listing-surface"
                >Surface</label
              >
              <input
                id="listing-surface"
                class="w-full border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
                name="surface"
                placeholder="e.g. linen, canvas"
              />
            </div>
            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="listing-dimensions"
                >Dimensions (cm)</label
              >
              <input
                id="listing-dimensions"
                class="w-full border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
                name="dimensions"
                placeholder="e.g. 80 x 60"
              />
            </div>
          </div>
        </section>

        <div>
          <label
            class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
            for="listing-description"
            >Description *</label
          >
          <textarea
            id="listing-description"
            class="w-full resize-none border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
            name="description"
            rows="5"
            placeholder="Describe the work"
            required
          ></textarea>
        </div>

        <section>
          <p
            class="mb-4 text-xs font-medium uppercase tracking-[0.3em] text-auction-red"
          >
            Auction Settings
          </p>
          <div class="grid gap-4 sm:grid-cols-2 sm:gap-5">
            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="listing-reserve"
                >Reserve Price</label
              >
              <input
                id="listing-reserve"
                class="w-full border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
                name="reserve"
                type="number"
                min="0"
                placeholder="e.g. 5000"
              />
            </div>
            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="listing-deadline"
                >Auction Deadline *</label
              >
              <input
                id="listing-deadline"
                class="w-full border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
                name="deadline"
                type="datetime-local"
                required
              />
            </div>
          </div>
        </section>

        <section>
          <label
            class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
            for="media-url"
            >Media Gallery (Image URLs)</label
          >
          <div class="flex gap-2">
            <input
              id="media-url"
              class="min-w-0 flex-1 border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
              type="url"
              placeholder="https://example.com/artwork.jpg"
            />
            <button
              id="add-media"
              class="border border-line bg-white px-4 py-3 text-xs font-medium uppercase tracking-[0.15em]"
              type="button"
            >
              Add
            </button>
          </div>
          <div id="media-preview" class="mt-3 grid grid-cols-3 gap-2"></div>
        </section>

        <div class="border-t border-line pt-5">
          <button
            class="w-full bg-auction-red py-4 text-xs font-semibold uppercase tracking-[0.2em] text-white"
            type="submit"
          >
            Submit for Auction
          </button>
        </div>
      </form>
    </main>
    <footer></footer>
  </body>
</html>
