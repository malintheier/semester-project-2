<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Edit your Arthaus profile details and images."
    />
    <title>Edit Profile</title>
    <script type="module" crossorigin src="/assets/editProfile-C4x1gHGp.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/user-state-DDGUZ9VV.js">
    <link rel="modulepreload" crossorigin href="/assets/get-HmZ1QuMT.js">
    <link rel="modulepreload" crossorigin href="/assets/post-FXySHsi6.js">
    <link rel="modulepreload" crossorigin href="/assets/api-key-DYm7rV1u.js">
    <link rel="stylesheet" crossorigin href="/assets/user-state-CMlsPyIA.css">
  </head>
  <body class="bg-paper font-sans text-ink">
    <main class="mx-auto max-w-2xl px-4 pb-24 pt-5 sm:px-6 lg:px-10 lg:py-20">
      <a
        class="inline-flex items-center gap-2 text-xs font-medium uppercase tracking-[0.2em] text-muted-ink"
        href="./profile.html"
        >&lt;- Back to Profile</a
      >
      <p
        class="mb-2 mt-10 text-xs font-medium uppercase tracking-[0.3em] text-auction-red"
      >
        Account
      </p>
      <h1 class="mb-8 font-display text-3xl font-black italic sm:text-5xl">
        Edit Profile
      </h1>

      <p
        id="edit-status"
        class="mb-8 hidden border border-success bg-success/10 p-4 text-sm font-medium text-success"
        role="status"
        aria-live="polite"
      ></p>

      <form id="edit-profile-form" class="space-y-7">
        <div>
          <label
            class="text-xs font-medium uppercase tracking-[0.2em] text-muted-ink"
            for="display-name"
            >Display Name</label
          >
          <input
            id="display-name"
            class="mt-2 w-full border border-line bg-white px-4 py-3 text-base text-muted-ink"
            type="text"
            readonly
          />
        </div>

        <div>
          <label
            class="text-xs font-medium uppercase tracking-[0.2em] text-muted-ink"
            for="bio"
            >Bio</label
          >
          <textarea
            id="bio"
            class="mt-2 w-full resize-none border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
            rows="4"
            maxlength="160"
          ></textarea>
          <p class="mt-1.5 text-xs text-muted-ink">
            Shown on your public profile beneath your name.
          </p>
        </div>

        <div>
          <label
            class="text-xs font-medium uppercase tracking-[0.2em] text-muted-ink"
            for="avatar-url"
            >Avatar Image URL</label
          >
          <div class="mt-2 flex items-start gap-3">
            <input
              id="avatar-url"
              class="min-w-0 flex-1 border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
              type="url"
            />
            <div
              class="h-12 w-12 shrink-0 overflow-hidden border-2 border-line bg-auction-red"
            >
              <img
                id="avatar-preview"
                class="hidden h-full w-full object-cover"
                src=""
                alt="Avatar preview"
              />
              <span
                id="avatar-initials"
                class="flex h-full items-center justify-center font-display text-lg font-black italic text-paper"
              ></span>
            </div>
          </div>
        </div>

        <div>
          <label
            class="text-xs font-medium uppercase tracking-[0.2em] text-muted-ink"
            for="banner-url"
            >Banner Image URL</label
          >
          <input
            id="banner-url"
            class="mt-2 w-full border border-line bg-white px-4 py-3 text-sm outline-none focus:border-ink"
            type="url"
          />
          <div
            id="banner-preview-wrap"
            class="mt-3 hidden h-24 overflow-hidden border border-line"
          >
            <img
              id="banner-preview"
              class="h-full w-full object-cover opacity-60"
              src=""
              alt="Banner preview"
            />
          </div>
        </div>

        <div class="flex gap-3 border-t border-line pt-5">
          <button
            class="flex-1 bg-auction-red px-5 py-4 text-xs font-semibold uppercase tracking-[0.2em] text-white"
            type="submit"
          >
            Save Changes
          </button>
          <a
            class="border border-line px-6 py-4 text-xs font-medium uppercase tracking-[0.2em] text-muted-ink"
            href="./profile.html"
            >Cancel</a
          >
        </div>
      </form>
    </main>
  </body>
</html>
