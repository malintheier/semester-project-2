<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Log in to your Arthaus account." />
    <title>Log In</title>
    <script type="module" crossorigin src="/assets/login-Be_qIgdv.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/user-state-5oslsYq7.js">
    <link rel="modulepreload" crossorigin href="/assets/post-DBsons9j.js">
    <link rel="modulepreload" crossorigin href="/assets/api-key-B9BrNeAQ.js">
    <link rel="stylesheet" crossorigin href="/assets/user-state-BiGe_S-y.css">
  </head>
  <body class="bg-paper font-sans text-ink">
    <main
      class="flex min-h-[80vh] items-center justify-center px-4 py-20 sm:px-6"
    >
      <div class="w-full max-w-md">
        <div class="mb-12 text-center">
          <h1 class="mb-3 font-display text-5xl font-black italic">
            Welcome Back
          </h1>
          <p class="text-sm text-muted-ink">
            Sign in to your collector account
          </p>
        </div>

        <div class="border border-line bg-card p-8 lg:p-10">
          <div id="login-success" class="hidden py-8 text-center">
            <div
              class="mx-auto mb-4 flex h-12 w-12 items-center justify-center bg-success text-2xl text-paper"
            >
              &check;
            </div>
            <p class="font-display text-base font-bold italic">Signed in.</p>
            <p class="mt-1 text-sm text-muted-ink">Redirecting...</p>
          </div>

          <form id="login-form" class="space-y-5" novalidate>
            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="email"
                >Email</label
              >
              <input
                id="email"
                class="w-full border border-line bg-paper px-4 py-3 text-sm outline-none focus:border-ink"
                name="email"
                type="email"
                placeholder="your@email.com"
                required
              />
            </div>

            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="password"
                >Password</label
              >
              <input
                id="password"
                class="w-full border border-line bg-paper px-4 py-3 text-sm outline-none focus:border-ink"
                name="password"
                type="password"
                placeholder="Password"
                required
                minlength="8"
              />
            </div>

            <p
              id="login-message"
              class="hidden"
              role="status"
              aria-live="polite"
            ></p>
            <button
              class="mt-2 w-full bg-auction-red py-4 text-xs font-semibold uppercase tracking-[0.2em] text-paper"
              type="submit"
            >
              Sign In
            </button>
          </form>
        </div>

        <p class="mt-6 text-center text-sm text-muted-ink">
          New to ARTHAUS?
          <a class="text-ink underline" href="./register.html"
            >Create account</a
          >
        </p>
      </div>
    </main>
  </body>
</html>
