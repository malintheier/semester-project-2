<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View an Arthaus member profile, artwork and listings."
    />
    <title>Profile</title>
    <script type="module" crossorigin src="/assets/profile-MNJzB7RG.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/user-state-DhSBwa_0.js">
    <link rel="modulepreload" crossorigin href="/assets/get-HmZ1QuMT.js">
    <link rel="modulepreload" crossorigin href="/assets/post-DBsons9j.js">
    <link rel="modulepreload" crossorigin href="/assets/api-key-CeOIcsgd.js">
    <link rel="stylesheet" crossorigin href="/assets/user-state-EB4r6iWG.css">
  </head>
  <body class="bg-paper font-sans text-ink">
    <main class="pb-24">
      <p
        id="profile-status"
        class="hidden"
        role="status"
        aria-live="polite"
      ></p>

      <div id="profile-content" class="hidden">
        <section class="relative h-36 overflow-hidden bg-ink lg:h-64">
          <img
            id="profile-banner"
            class="hidden h-full w-full object-cover opacity-30"
            src=""
            alt=""
          />
          <div
            class="absolute inset-0 bg-gradient-to-r from-ink/90 to-ink/40"
          ></div>
          <p
            class="absolute bottom-[-1.6rem] left-4 font-display text-7xl font-black italic text-paper/10 sm:left-6 lg:left-10 lg:text-9xl"
          >
            Profile
          </p>
          <div class="absolute right-4 top-4 sm:right-6 lg:right-10">
            <a
              class="bg-ink/70 px-3 py-2 text-xs font-semibold uppercase tracking-[0.2em] text-paper"
              href="./edit-profile.html"
              >Edit Profile</a
            >
          </div>
        </section>

        <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-10">
          <div
            class="relative -mt-10 h-20 w-20 overflow-hidden border-[3px] border-paper bg-auction-red lg:-mt-12 lg:h-24 lg:w-24 lg:border-4"
          >
            <img
              id="profile-avatar"
              class="hidden h-full w-full object-cover"
              src=""
              alt=""
            />
            <span
              id="profile-initials"
              class="flex h-full items-center justify-center font-display text-3xl font-black italic text-paper lg:text-4xl"
            ></span>
          </div>

          <div
            class="mt-4 flex flex-col justify-between gap-5 sm:flex-row sm:items-start"
          >
            <div class="min-w-0 flex-1">
              <h1
                id="profile-name"
                class="font-display text-2xl font-black italic"
              ></h1>
              <p id="profile-meta" class="mt-1 text-xs text-muted-ink"></p>
              <p
                id="profile-bio"
                class="mt-4 max-w-lg font-display text-base italic text-muted-ink"
              ></p>
            </div>
            <div class="flex flex-col gap-3 sm:flex-row sm:items-start">
              <div class="shrink-0 border border-line bg-card px-4 py-3">
                <p
                  class="text-[10px] font-semibold uppercase tracking-[0.2em] text-muted-ink"
                >
                  Credits
                </p>
                <p
                  id="profile-credits"
                  class="mt-1 font-display text-xl font-black text-auction-red"
                ></p>
              </div>
              <a
                class="w-full bg-auction-red px-5 py-4 text-center text-sm font-semibold uppercase tracking-[0.2em] text-paper sm:w-auto"
                href="./create-listing.html"
                >+ Submit Work</a
              >
            </div>
          </div>

          <div class="mt-10 flex border-b border-line" role="tablist">
            <button
              id="listings-tab"
              class="border-b-2 border-auction-red px-6 py-3 text-sm font-semibold text-auction-red"
              type="button"
              role="tab"
              aria-selected="true"
            >
              My Listings
            </button>
            <button
              id="bids-tab"
              class="px-6 py-3 text-sm font-semibold text-muted-ink"
              type="button"
              role="tab"
              aria-selected="false"
            >
              My Bids
            </button>
          </div>

          <section id="listings-panel" class="mt-8" role="tabpanel">
            <ul
              id="profile-listings"
              class="grid grid-cols-2 gap-x-3 gap-y-8 sm:grid-cols-2 lg:grid-cols-3 lg:gap-x-8 lg:gap-y-12"
            ></ul>
          </section>
          <section id="bids-panel" class="mt-8 hidden" role="tabpanel">
            <ol id="profile-bids"></ol>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
