<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View an Arthaus artist profile, listings and bids."
    />
    <title>Artist Profile | Arthaus</title>
    <script type="module" crossorigin src="/assets/publicProfile-Bs8Z7TEC.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/user-state-5oslsYq7.js">
    <link rel="modulepreload" crossorigin href="/assets/get-HmZ1QuMT.js">
    <link rel="modulepreload" crossorigin href="/assets/post-DBsons9j.js">
    <link rel="modulepreload" crossorigin href="/assets/api-key-B9BrNeAQ.js">
    <link rel="stylesheet" crossorigin href="/assets/user-state-BiGe_S-y.css">
  </head>
  <body class="bg-paper font-sans text-ink">
    <main class="pb-24">
      <p
        id="public-profile-status"
        class="hidden"
        role="status"
        aria-live="polite"
      ></p>
      <div id="public-profile-content" class="hidden">
        <section class="relative h-36 overflow-hidden bg-ink lg:h-64">
          <img
            id="public-profile-banner"
            class="hidden h-full w-full object-cover"
            src=""
            alt=""
          />
        </section>
        <div class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-10">
          <div
            class="relative -mt-10 h-20 w-20 overflow-hidden border-[3px] border-paper bg-auction-red lg:-mt-12 lg:h-24 lg:w-24 lg:border-4"
          >
            <img
              id="public-profile-avatar"
              class="hidden h-full w-full object-cover"
              src=""
              alt=""
            />
            <span
              id="public-profile-initials"
              class="flex h-full items-center justify-center font-display text-3xl font-black italic text-paper lg:text-4xl"
            ></span>
          </div>
          <div
            class="mt-4 flex flex-col justify-between gap-5 sm:flex-row sm:items-start"
          >
            <div class="min-w-0 flex-1">
              <h1
                id="public-profile-name"
                class="font-display text-2xl font-black italic"
              ></h1>
              <p
                id="public-profile-meta"
                class="mt-1 text-xs text-muted-ink"
              ></p>
              <p
                id="public-profile-bio"
                class="mt-4 max-w-lg font-serif text-base font-medium italic leading-7 text-muted-ink sm:text-lg"
              ></p>
            </div>
            <div class="shrink-0 border border-line bg-card px-4 py-3">
              <p
                class="text-[10px] font-semibold uppercase tracking-[0.2em] text-muted-ink"
              >
                Credits
              </p>
              <p
                id="public-profile-credits"
                class="mt-1 font-display text-xl font-black text-auction-red"
              ></p>
            </div>
          </div>
          <div class="mt-10 flex border-b border-line" role="tablist">
            <button
              id="public-listings-tab"
              class="border-b-2 border-auction-red px-6 py-3 text-xs font-semibold uppercase tracking-[0.15em] text-auction-red"
              type="button"
              role="tab"
              aria-selected="true"
            >
              Listings
            </button>
            <button
              id="public-bids-tab"
              class="px-6 py-3 text-xs font-semibold uppercase tracking-[0.15em] text-muted-ink"
              type="button"
              role="tab"
              aria-selected="false"
            >
              Bids
            </button>
          </div>
          <section id="public-listings-panel" class="mt-8" role="tabpanel">
            <ul
              id="public-profile-listings"
              class="grid grid-cols-2 gap-x-3 gap-y-8 sm:grid-cols-2 lg:grid-cols-3 lg:gap-x-8 lg:gap-y-12"
            ></ul>
          </section>
          <section id="public-bids-panel" class="mt-8 hidden" role="tabpanel">
            <ol id="public-profile-bids"></ol>
          </section>
        </div>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
