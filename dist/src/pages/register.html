<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create an account and join the Arthaus art community."
    />
    <title>Register</title>
    <script type="module" crossorigin src="/assets/register-BfqD2Snh.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/user-state-D57L5X-h.js">
    <link rel="modulepreload" crossorigin href="/assets/post-DBsons9j.js">
    <link rel="stylesheet" crossorigin href="/assets/user-state-B2VKf9JI.css">
  </head>
  <body class="bg-paper font-sans text-ink">
    <main
      class="flex min-h-[80vh] items-center justify-center px-4 py-20 sm:px-6"
    >
      <div class="w-full max-w-md">
        <div class="mb-12 text-center">
          <h1 class="mb-3 font-display text-5xl font-black italic">Join Us</h1>
          <p class="text-sm text-muted-ink">
            Create an account to start bidding and selling
          </p>
        </div>

        <div class="border border-line bg-card p-8 lg:p-10">
          <div id="register-success" class="hidden py-8 text-center">
            <div
              class="mx-auto mb-4 flex h-12 w-12 items-center justify-center bg-success text-2xl text-paper"
            >
              &check;
            </div>
            <p class="font-display text-base font-bold italic">
              Account created.
            </p>
            <p class="mt-1 text-sm text-muted-ink">Redirecting...</p>
          </div>

          <form
            id="register-form"
            class="space-y-5"
            novalidate
            autocomplete="off"
          >
            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="full-name"
                >Full Name</label
              >
              <input
                id="full-name"
                class="w-full border border-line bg-paper px-4 py-3 text-sm outline-none focus:border-ink"
                name="full-name"
                type="text"
                placeholder="Jane Hopper"
                autocomplete="name"
                required
                minlength="2"
              />
            </div>

            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="username"
                >Username</label
              >
              <input
                id="username"
                class="w-full border border-line bg-paper px-4 py-3 text-sm outline-none focus:border-ink"
                name="username"
                type="text"
                placeholder="jane_hopper"
                autocomplete="off"
                required
                minlength="2"
              />
            </div>

            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="email"
                >Email</label
              >
              <input
                id="email"
                class="w-full border border-line bg-paper px-4 py-3 text-sm outline-none focus:border-ink"
                name="email"
                type="email"
                placeholder="you@stud.noroff.no"
                autocomplete="email"
                required
              />
              <p class="mt-2 text-xs text-muted-ink">
                Only <strong>@stud.noroff.no</strong> addresses accepted
              </p>
            </div>

            <div>
              <label
                class="mb-2 block text-xs uppercase tracking-[0.2em] text-muted-ink"
                for="password"
                >Password</label
              >
              <input
                id="password"
                class="w-full border border-line bg-paper px-4 py-3 text-sm outline-none focus:border-ink"
                name="password"
                type="password"
                placeholder="Password"
                autocomplete="new-password"
                required
                minlength="8"
              />
            </div>

            <p
              id="register-message"
              class="hidden"
              role="status"
              aria-live="polite"
            ></p>
            <button
              class="mt-2 w-full bg-auction-red py-4 text-xs font-semibold uppercase tracking-[0.2em] text-paper"
              type="submit"
            >
              Create Account
            </button>
          </form>
        </div>

        <p class="mt-6 text-center text-sm text-muted-ink">
          Already have an account?
          <a class="text-ink underline" href="./login.html">Sign in</a>
        </p>
      </div>
    </main>
  </body>
</html>
