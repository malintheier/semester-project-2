<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover and share unique artwork on Arthaus."
    />
    <title>Home</title>
  </head>
  <body>
    <header>
      <nav aria-label="Main navigation"></nav>
    </header>
    <main>
      <h1>Discover artwork</h1>
      <section aria-labelledby="active-listings-heading">
        <h2 id="active-listings-heading">Active listings</h2>
        <label for="listings-search">Search listings</label>
        <input
          id="listings-search"
          name="listings-search"
          type="search"
          placeholder="Search by title or keyword"
        />
        <p id="active-listings-status" role="status" aria-live="polite"></p>
        <ul id="active-listings"></ul>
      </section>
    </main>
    <footer></footer>
    <script type="module" src="./src/scripts/user-state.js"></script>
    <script type="module" src="./src/scripts/listings.js"></script>
  </body>
</html>
