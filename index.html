<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Discover and share unique artwork on Arthaus."
    >
    <title>Arthaus | Contemporary Art Auctions</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  </head>
  <body class="bg-paper font-sans text-ink">
    <header>
      <nav aria-label="Main navigation"></nav>
    </header>
    <main>
      <section
        id="featured-auction"
        class="relative h-[420px] overflow-hidden bg-ink lg:min-h-[88vh]"
      >
        <img
          id="featured-image"
          class="absolute inset-0 h-full w-full object-cover object-[center_20%] opacity-50 lg:opacity-45"
          src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs="
          alt=""
        >
        <div
          class="absolute inset-0 bg-gradient-to-t from-[rgba(13,12,10,0.97)_20%] via-[rgba(13,12,10,0.5)_50%] to-[rgba(13,12,10,0.3)_70%] lg:bg-gradient-to-r lg:from-ink lg:via-ink/55 lg:to-ink/15"
        ></div>
        <div
          class="absolute inset-x-0 bottom-0 flex flex-col px-5 pb-6 lg:relative lg:mx-auto lg:min-h-[88vh] lg:max-w-7xl lg:flex-col lg:justify-end lg:px-10 lg:py-32"
        >
          <p
            class="text-xs font-medium uppercase tracking-[0.3em] text-auction-red mb-0.5"
          >
            Live Auction · Featured Work
          </p>
          <h1
            id="featured-title"
            class="font-display text-[2.4rem] font-black italic leading-none text-paper mb-0.25 lg:mt-3 lg:max-w-[14ch] lg:mb-2 lg:text-6xl xl:text-8xl"
          >
            Featured artwork
          </h1>
          <p
            id="featured-artist"
            class="font-serif italic text-sm text-paper/60 mb-1 lg:mt-4 lg:font-display lg:text-lg lg:text-paper/65"
          ></p>
          <p id="featured-medium" class="hidden text-sm text-paper/40 lg:mt-1 lg:block"></p>
          <div
            class="mb-1 flex items-end gap-5 text-paper lg:mt-6 lg:mb-10 lg:flex-wrap lg:gap-x-8 lg:gap-y-3"
          >
            <div>
              <p class="text-xs font-medium uppercase tracking-widest text-paper/40">
                Current bid
              </p>
              <p
                id="featured-bid"
                class="mt-0.5 font-sans text-lg font-bold leading-none lg:mt-1.5 lg:text-[1.5rem]"
              ></p>
            </div>
            <div>
              <p class="text-xs font-medium uppercase tracking-widest text-paper/40">
                Bids
              </p>
              <p
                id="featured-bids"
                class="mt-0.5 font-sans text-lg font-bold leading-none lg:mt-1.5 lg:text-[1.5rem]"
              ></p>
            </div>
            <div>
              <p class="text-xs font-medium uppercase tracking-widest text-paper/40">
                Ends in
              </p>
              <p
                id="featured-deadline"
                class="mt-0.5 inline-flex items-center gap-2 font-sans text-lg font-bold leading-none text-paper lg:mt-1.5 lg:text-[1.5rem]"
              ></p>
            </div>
          </div>
          <div class="mt-6 flex flex-col gap-3 lg:mt-6 lg:flex-row lg:gap-4">
            <a
              id="featured-bid-link"
              class="w-full bg-auction-red py-3.5 text-center text-xs font-semibold uppercase tracking-[0.2em] text-white lg:w-auto lg:px-8 lg:py-4"
              href="./src/pages/place-bid.html"
              >Place a Bid</a
            >
            <a
              class="hidden sm:block border border-paper/20 px-8 py-4 text-center text-xs font-medium uppercase tracking-[0.2em] text-paper/60"
              href="#auctions-grid"
              >View All Auctions</a
            >
          </div>
        </div>
      </section>

      <section
        id="auctions-grid"
        class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-10 lg:py-24"
        aria-labelledby="active-listings-heading"
      >
        <div
          class="mb-6 flex flex-col justify-between gap-6 lg:mb-12 lg:flex-row lg:items-end"
        >
          <div>
            <p
              class="text-xs font-medium uppercase tracking-[0.3em] text-muted-ink"
            >
              Currently Bidding
            </p>
            <h2
              id="active-listings-heading"
              class="mt-2 font-display text-4xl font-black leading-none sm:text-6xl"
            >
              The Collection
            </h2>
          </div>
          <div class="w-full lg:w-auto lg:max-w-xs">
            <label class="sr-only" for="listings-search">Search listings</label>
            <input
              id="listings-search"
              class="w-full border border-line bg-paper px-4 py-3 text-sm text-ink outline-none focus:border-ink"
              name="listings-search"
              type="search"
              placeholder="Search publisher or title"
            >
          </div>
        </div>

        <div class="mb-6 flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
          <div id="category-filters" class="flex w-full gap-1 lg:w-auto lg:gap-2">
            <button
              class="category-filter flex-1 border border-line bg-transparent px-1 py-2 text-xs font-medium uppercase tracking-[0.15em] text-muted-ink lg:flex-none lg:px-4"
              data-category="all"
              type="button"
            >
              All
            </button>
            <button
              class="category-filter flex-1 border border-line bg-transparent px-1 py-2 text-xs font-medium uppercase tracking-[0.15em] text-muted-ink lg:flex-none lg:px-4"
              data-category="oil"
              type="button"
            >
              Oil
            </button>
            <button
              class="category-filter flex-1 border border-line bg-transparent px-1 py-2 text-xs font-medium uppercase tracking-[0.15em] text-muted-ink lg:flex-none lg:px-4"
              data-category="acrylic"
              type="button"
            >
              Acrylic
            </button>
            <button
              class="category-filter flex-1 border border-line bg-transparent px-1 py-2 text-xs font-medium uppercase tracking-[0.15em] text-muted-ink lg:flex-none lg:px-4"
              data-category="watercolor"
              type="button"
            >
              Watercolor
            </button>
          </div>
          <div class="w-full lg:w-auto">
            <label class="sr-only" for="listings-sort">Sort listings</label>
            <select
              id="listings-sort"
              class="w-full border border-line bg-paper px-3 py-2 text-xs text-ink outline-none"
              name="listings-sort"
            >
              <option value="ending-soon">Ending soon</option>
              <option value="highest-bid">Highest bid</option>
              <option value="lowest-bid">Lowest bid</option>
            </select>
          </div>
        </div>

        <p
          id="active-listings-status"
          class="hidden mb-6 text-sm text-muted-ink"
          role="status"
          aria-live="polite"
        ></p>
        <ul
          id="active-listings"
          class="mt-6 grid grid-cols-1 gap-x-4 gap-y-8 md:grid-cols-3 lg:gap-x-8 lg:gap-y-12"
        ></ul>
        <button
          id="load-more-listings"
          class="mx-auto mt-10 hidden block bg-auction-red px-5 py-4 text-sm font-semibold uppercase tracking-[0.2em] text-white"
          type="button"
        >
          Load more
        </button>
      </section>
    </main>
    <footer></footer>
    <script type="module" src="./src/scripts/user-state.ts"></script>
    <script type="module" src="./src/scripts/listings.ts"></script>
  </body>
</html>
