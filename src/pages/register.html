<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create an account and join the Arthaus art community."
    />
    <title>Register</title>
  </head>
  <body>
    <main>
      <h1>Create an account</h1>
      <form id="register-form" novalidate>
        <label for="full-name">Full name</label>
        <input
          id="full-name"
          name="full-name"
          type="text"
          required
          minlength="2"
        />

        <label for="name">Username</label>
        <input id="name" name="name" type="text" required minlength="2" />

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          required
          minlength="8"
        />

        <button type="submit">Register</button>
      </form>
      <p id="register-message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="../scripts/user-state.ts"></script>
    <script type="module" src="../scripts/register.ts"></script>
  </body>
</html>
